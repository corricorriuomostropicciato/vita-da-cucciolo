<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vita da Cucciolo</title>

<style>
*{box-sizing:border-box}
body{
margin:0;padding:20px 10px;
font-family:Arial,sans-serif;
background:linear-gradient(#b9e6f5,#f4ead7);
color:#4a3b2e
}
.game{max-width:560px;margin:auto}
h1{text-align:center;color:#c4602f;margin:5px 0}
.subtitle{text-align:center;color:#7c6a57;margin-bottom:15px}
.name{text-align:center;margin-bottom:12px}
input{
padding:7px 10px;border-radius:10px;
border:2px solid #eadfc8;
background:#fffdf6
}
.scene{
position:relative;
height:350px;
overflow:hidden;
border:5px solid #fffdf6;
border-radius:22px;
background:linear-gradient(#aee0f4 45%,#8fbe6a 45%);
box-shadow:0 8px 20px #0002
}
.sun{
position:absolute;right:12%;top:8%;
width:65px;height:65px;
border-radius:50%;
background:#f7cb4a
}
.cloud{
position:absolute;width:65px;height:20px;
background:white;border-radius:30px;opacity:.8
}
.c1{top:12%;left:8%}.c2{top:20%;right:25%}
.path{
position:absolute;bottom:0;left:37%;
width:26%;height:60%;
background:#c99a63;
clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)
}
.flower{
position:absolute;width:10px;height:10px;
border-radius:50%;background:#ee8aa3
}
.dog{
position:absolute;
left:50%;bottom:20%;
transform:translateX(-50%);
font-size:85px;
animation:salta 2.5s infinite ease-in-out
}
@keyframes salta{
50%{transform:translateX(-50%) translateY(-8px)}
}
.bubble{
position:absolute;
top:8%;left:55%;
background:white;
padding:7px 12px;
border-radius:15px;
font-size:20px;
display:none;
box-shadow:0 3px 8px #0002
}
.bubble.show{display:block}
.msg{
text-align:center;
font-weight:bold;
color:#c4602f;
min-height:25px;
margin:13px 0
}
.stats{
background:#fffdf6;
border:2px solid #ede2c9;
border-radius:16px;
padding:14px
}
.row{
display:flex;
align-items:center;
gap:9px;
margin:9px 0
}
.icon{width:22px}
.label{width:75px;font-weight:bold;font-size:13px}
.track{
flex:1;height:14px;
background:#f1e7d2;
border-radius:10px;
overflow:hidden
}
.bar{
height:100%;
width:80%;
border-radius:10px;
background:#7cb86a;
transition:.4s
}
.actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:12px
}
button{
border:2px solid #ede2c9;
background:#fffdf6;
border-radius:14px;
padding:10px 4px;
font-weight:bold;
cursor:pointer
}
button:active{transform:scale(.94)}
.big{font-size:20px;display:block}
.affetto{text-align:center;color:#7c6a57}
.affetto b{color:#c4602f}
.footer{text-align:center;font-size:11px;color:#7c6a57}
</style>
</head>

<body>

<div class="game">

<h1>🐾 Vita da Cucciolo</h1>

<div class="subtitle">
Prenditi cura del tuo Pinscher toy in campagna 🌼
</div>

<div class="name">
Il suo nome è
<input id="nome" value="Briciola" maxlength="14">
</div>

<div class="scene">

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="path"></div>

<div class="flower" style="left:8%;bottom:12%"></div>
<div class="flower" style="left:15%;bottom:18%"></div>
<div class="flower" style="right:12%;bottom:15%"></div>
<div class="flower" style="right:20%;bottom:25%"></div>

<div class="bubble" id="bubble"></div>

<div class="dog" id="dog">🐕</div>

</div>

<div class="msg" id="msg">
Ciao! Sono felice di vederti! 🐶💕
</div>

<div class="stats">

<div class="row">
<div class="icon">🍖</div>
<div class="label">Fame</div>
<div class="track">
<div class="bar" id="fame"></div>
</div>
</div>

<div class="row">
<div class="icon">⚡</div>
<div class="label">Energia</div>
<div class="track">
<div class="bar" id="energia"></div>
</div>
</div>

<div class="row">
<div class="icon">💕</div>
<div class="label">Felicità</div>
<div class="track">
<div class="bar" id="felicita"></div>
</div>
</div>

<div class="row">
<div class="icon">🧼</div>
<div class="label">Pulizia</div>
<div class="track">
<div class="bar" id="pulizia"></div>
</div>
</div>

</div>

<div class="actions">

<button onclick="nutri()">
<span class="big">🍖</span>
Nutri
</button>

<button onclick="gioca()">
<span class="big">🎾</span>
Gioca
</button>

<button onclick="coccola()">
<span class="big">💕</span>
Coccola
</button>

<button onclick="bagno()">
<span class="big">🛁</span>
Bagnetto
</button>

<button onclick="passeggia()">
<span class="big">🌼</span>
Passeggia
</button>

<button onclick="dormi()">
<span class="big">💤</span>
Dormi
</button>

</div>

<p class="affetto">
Affetto guadagnato:
<b id="affetto">0</b> 💗
</p>

<p class="footer">
Le statistiche calano lentamente col tempo: torna a trovarlo! 🐾
</p>

</div>

<script>

let stato={
fame:80,
energia:80,
felicita:80,
pulizia:80,
affetto:0,
dorme:false
};

function limite(x){
return Math.max(0,Math.min(100,x));
}

function nome(){
return document.getElementById("nome").value.trim()||"Il cucciolo";
}

function aggiorna(){

document.getElementById("fame").style.width=stato.fame+"%";
document.getElementById("energia").style.width=stato.energia+"%";
document.getElementById("felicita").style.width=stato.felicita+"%";
document.getElementById("pulizia").style.width=stato.pulizia+"%";

document.getElementById("affetto").textContent=stato.affetto;

}

function messaggio(testo){
document.getElementById("msg").textContent=testo;
}

function nutri(){

if(stato.dorme){
messaggio(nome()+" sta dormendo. 💤");
return;
}

stato.fame=limite(stato.fame+28);
stato.pulizia=limite(stato.pulizia-4);
stato.affetto+=2;

messaggio(nome()+" scodinzola felice per la pappa! 🍖");

aggiorna();
}

function gioca(){

if(stato.dorme){
messaggio(nome()+" sta dormendo. 💤");
return;
}

if(stato.energia<12){
messaggio(nome()+" è troppo stanco per giocare. 😴");
return;
}

stato.felicita=limite(stato.felicita+22);
stato.energia=limite(stato.energia-14);
stato.fame=limite(stato.fame-6);
stato.affetto+=3;

messaggio(nome()+" corre dietro alla pallina! 🎾");

aggiorna();
}

function coccola(){

if(stato.dorme){
messaggio(nome()+" dorme beato. 💤");
return;
}

stato.felicita=limite(stato.felicita+16);
stato.affetto+=3;

messaggio(nome()+" si accoccola vicino a te. 💕");

aggiorna();
}

function bagno(){

if(stato.dorme){
messaggio(nome()+" sta dormendo. 💤");
return;
}

stato.pulizia=limite(stato.pulizia+30);
stato.felicita=limite(stato.felicita-4);
stato.affetto+=1;

messaggio(nome()+" è pulito e profuma di buono! 🛁");

aggiorna();
}

function passeggia(){

if(stato.dorme){
messaggio(nome()+" sta dormendo. 💤");
return;
}

if(stato.energia<18){
messaggio(nome()+" è troppo stanco per passeggiare. 😴");
return;
}

stato.felicita=limite(stato.felicita+18);
stato.energia=limite(stato.energia-16);
stato.pulizia=limite(stato.pulizia-8);
stato.affetto+=4;

messaggio(nome()+" passeggia felice tra i fiori! 🌼🐾");

aggiorna();
}

function dormi(){

if(stato.dorme){

stato.dorme=false;

messaggio(nome()+" si è svegliato tutto arzillo! ☀️");

aggiorna();

return;
}

stato.dorme=true;

messaggio(nome()+" si acciambella e si addormenta. 💤");

aggiorna();

setTimeout(function(){

if(!stato.dorme)return;

stato.energia=limite(stato.energia+45);
stato.dorme=false;

messaggio(nome()+" si è svegliato pieno di energia! ⚡🐶");

aggiorna();

},5000);

}

setInterval(function(){

if(stato.dorme){

stato.fame=limite(stato.fame-1);

}else{

stato.fame=limite(stato.fame-3);
stato.energia=limite(stato.energia-2);
stato.felicita=limite(stato.felicita-2);
stato.pulizia=limite(stato.pulizia-1);

}

aggiorna();

},4000);

aggiorna();

</script>

</body>
</html>
